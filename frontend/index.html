<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SimpleLogz — AI Log Intelligence</title>
  <meta name="description" content="AI-powered log analysis. Understand any error in seconds."/>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>
  <style>
    /* ── Hard font overrides — bypasses CSS module scoping ── */
    html { font-size: 18px !important; }
    body { font-size: 16px !important; line-height: 1.7 !important; }

    /* Hero */
    h1 { font-size: clamp(44px, 6.5vw, 76px) !important; font-weight: 800 !important; line-height: 1.1 !important; letter-spacing: -2px !important; }
    h2 { font-size: clamp(26px, 3.5vw, 40px) !important; font-weight: 700 !important; }
    h3 { font-size: clamp(18px, 2vw, 22px) !important; font-weight: 600 !important; }
    p  { font-size: clamp(15px, 1.5vw, 18px) !important; line-height: 1.75 !important; }

    /* Nav */
    nav a, nav button { font-size: 15px !important; }

    /* Feature cards */
    [class*="featureTitle"]  { font-size: 18px !important; font-weight: 600 !important; }
    [class*="featureDesc"]   { font-size: 15px !important; line-height: 1.7 !important; }

    /* Stats */
    [class*="statNum"]   { font-size: clamp(30px, 4vw, 46px) !important; }
    [class*="statLabel"] { font-size: 15px !important; }

    /* Section */
    [class*="sectionTitle"] { font-size: clamp(26px, 3.5vw, 40px) !important; }
    [class*="sectionSub"]   { font-size: 18px !important; }
    [class*="sectionEyebrow"] { font-size: 13px !important; }

    /* CTA */
    [class*="ctaTitle"] { font-size: clamp(26px, 3.5vw, 42px) !important; }
    [class*="ctaSub"]   { font-size: 18px !important; }

    /* Footer */
    [class*="footerLinks"] a  { font-size: 15px !important; }
    [class*="footerDesc"]     { font-size: 15px !important; }
    [class*="footerBottom"]   { font-size: 14px !important; }
    [class*="footerBrandName"]{ font-size: 18px !important; }

    /* Analyzer */
    [class*="plainEnglish"] { font-size: 16px !important; }
    [class*="stepAction"]   { font-size: 15px !important; }
    [class*="metricValue"]  { font-size: 15px !important; }
    [class*="textarea"]     { font-size: 15px !important; }
    [class*="chip"]         { font-size: 13px !important; }

    /* About */
    [class*="timelineText"] { font-size: 16px !important; }
    [class*="pillarTitle"]  { font-size: 18px !important; }
    [class*="pillarBody"]   { font-size: 15px !important; }

    /* Projects */
    [class*="cardName"] { font-size: 17px !important; }
    [class*="cardDesc"] { font-size: 14px !important; }

    /* Buttons */
    .btn    { font-size: 15px !important; }
    .btn-lg { font-size: 17px !important; }
    .btn-sm { font-size: 14px !important; }

    /* Forms */
    .form-input, .form-label { font-size: 15px !important; }

    /* Mobile — ensure nothing is too small */
    @media (max-width: 640px) {
      html { font-size: 16px !important; }
      body { font-size: 15px !important; }
      h1   { font-size: clamp(32px, 9vw, 48px) !important; letter-spacing: -1px !important; }
      h2   { font-size: clamp(22px, 6vw, 32px) !important; }
      p    { font-size: 15px !important; }
      nav a, nav button { font-size: 16px !important; }
      [class*="featureDesc"]  { font-size: 14px !important; }
      [class*="sectionSub"]   { font-size: 16px !important; }
      [class*="ctaSub"]       { font-size: 16px !important; }
      [class*="mobileLink"]   { font-size: 17px !important; }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
